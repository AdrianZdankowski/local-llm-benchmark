[project]
name = "mybench"
version = "0.1.0"
description = "Benchmark lokalnych LLM (Qwen3, Gemma 4)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mybench"]
