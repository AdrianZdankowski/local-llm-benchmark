[project]
name = "mybench"
version = "0.1.0"
description = "Benchmark lokalnych LLM (Qwen3, Gemma 4)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "matplotlib>=3.8"]

[project.optional-dependencies]
# scripts/score.py; the runner and aggregate.py need only the standard library.
scoring-listqa = ["evaluate", "rouge-score", "scipy", "nltk", "absl-py"]
scoring-ideafix = ["sentence-transformers", "transformers", "torch", "spacy", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mybench"]
